<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
:root {
  --clr-bg:           #f5f1e8;
  --clr-bg-2:         #efe6d5;
  --clr-surface:      #ffffff;
  --clr-glass:        rgba(255, 255, 255, 0.80);
  --clr-glass-border: rgba(38, 121, 74, 0.30);
  --clr-primary:      #26794A;
  --clr-primary-light:#3D8F5E;
  --clr-primary-glow: rgba(38, 121, 74, 0.20);
  --clr-accent:       #B7791F;
  --clr-gold:         #C9A227;
  --clr-gold-light:   #E6C24B;
  --clr-text:         #3D3D3D;
  --clr-text-muted:   #6B6B6B;
  --clr-text-dim:     #A0A0A0;
  --clr-white:        #ffffff;

  --font-sans:    'Inter', sans-serif;
  --font-display: 'Playfair Display', serif;
  --font-mono:    'Space Mono', monospace;

  --radius-sm:    8px;
  --radius-md:    16px;
  --radius-lg:    24px;
  --radius-xl:    36px;

  --shadow-glow:  0 0 40px rgba(38, 121, 74, 0.20);
  --shadow-card:  0 8px 32px rgba(0, 0, 0, 0.08);

  --transition:   all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: all 0.18s ease;
}
body{margin:0;background:var(--clr-bg);font-family:var(--font-sans)}
/* ---- PROJECT DIALOG ---- */
.proj-dialog {
  margin: auto;
  border: 1px solid var(--clr-glass-border);
  padding: 0;
  background: var(--clr-surface);
  color: var(--clr-text);
  width: min(720px, calc(100vw - 32px));
  max-height: 88vh;
  border-radius: 0;
  box-shadow: 0 24px 80px rgba(44, 38, 30, 0.28);
  overflow: auto;
}
.proj-dialog::backdrop {
  background: rgba(30, 26, 20, 0.55);
  backdrop-filter: blur(3px);
}
.proj-dialog[open] {
  animation: dialogIn 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
}
.proj-dialog[open]::backdrop {
  animation: backdropIn 0.3s ease;
}
@keyframes dialogIn {
  from { opacity: 0; transform: translateY(14px) scale(0.985); }
  to   { opacity: 1; transform: none; }
}
@keyframes backdropIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .proj-dialog[open],
  .proj-dialog[open]::backdrop { animation: none; }
  .proj-dialog-media img { transition: none; opacity: 1; transform: none; }
}
.proj-dialog-inner {
  position: relative;
  padding: 0;
}
.proj-dialog-media {
  position: relative;
  margin: 0;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: var(--clr-bg-2);
  border-bottom: 1px solid var(--clr-glass-border);
}
.proj-dialog-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0;
  transform: scale(1.04);
  transition: opacity 0.5s ease, transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1);
}
.proj-dialog-media img.is-loaded {
  opacity: 1;
  transform: scale(1);
}
.proj-dialog-caption {
  position: absolute;
  left: 0;
  bottom: 0;
  right: 0;
  padding: 28px 20px 12px;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.92);
  background: linear-gradient(to top, rgba(28, 24, 18, 0.72), transparent);
  pointer-events: none;
}
.proj-dialog-body {
  padding: 30px 40px 36px;
}
.proj-dialog-close {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 3;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 253, 248, 0.94);
  border: 1px solid rgba(38, 121, 74, 0.28);
  border-radius: 0;
  font-size: 1.4rem;
  line-height: 1;
  cursor: pointer;
  color: var(--clr-text-muted);
  backdrop-filter: blur(6px);
  transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
}
.proj-dialog-close:hover,
.proj-dialog-close:focus-visible {
  background: var(--clr-primary);
  border-color: var(--clr-primary);
  color: #fff;
}
.proj-dialog-kicker {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--clr-accent);
  margin-bottom: 10px;
}
.proj-dialog-title {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3.4vw, 2.1rem);
  font-weight: 700;
  color: var(--clr-text);
  margin: 0 40px 14px 0;
  line-height: 1.15;
}
.proj-dialog-tldr {
  font-size: 1rem;
  color: var(--clr-primary);
  line-height: 1.65;
  border-left: 3px solid var(--clr-primary);
  padding-left: 14px;
  margin-bottom: 22px;
}
.proj-dialog-story-label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--clr-text-dim);
  margin-bottom: 8px;
}
.proj-dialog-story {
  font-size: 0.94rem;
  color: var(--clr-text-muted);
  line-height: 1.75;
  margin-bottom: 24px;
}
.proj-dialog-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 20px;
  font-size: 0.82rem;
  color: var(--clr-text-muted);
  padding-top: 18px;
  border-top: 1px solid var(--clr-glass-border);
  margin-bottom: 18px;
}
.proj-dialog-year {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 1px;
  color: var(--clr-text-dim);
}
.proj-dialog-stat strong {
  font-family: var(--font-display);
  font-size: 1.05rem;
  color: var(--clr-accent);
  margin-right: 4px;
}
.proj-dialog-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}


</style></head><body>
<dialog id="d" class="proj-dialog" open><div class="proj-dialog-inner">
<figure class="proj-dialog-media"><img id="i" src="images/IMG_9403~photo.JPG" alt="x" class="is-loaded"><figcaption class="proj-dialog-caption">Project 2025</figcaption></figure>
<div class="proj-dialog-body"><p class="proj-dialog-kicker">Featured Project</p><h2 class="proj-dialog-title">Large-Scale Mangrove Planting</h2><p class="proj-dialog-tldr">Restored 500+ ha.</p></div>
</div></dialog>
</body></html>
