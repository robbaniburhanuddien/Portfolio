<!DOCTYPE html><html><head><meta charset="utf-8"><title>Open Dialog Test</title></head><body>
<div id="app"></div>
<script>
// Load the page's JS into this page via script tag
const s = document.createElement('script');
s.src = '/script.js?v=15';
document.head.appendChild(s);
// Listen for DOMContentLoaded to auto-open
window.addEventListener('load', function(){
  setTimeout(function(){
    var cards = document.querySelectorAll('.project-card');
    if (cards.length) cards[0].click();
  }, 2000);
});
</script>
</body></html>
